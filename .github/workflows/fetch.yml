name: fetch shop data and photos

on:
  schedule:
    - cron: '17 21 * * *'   # every day 06:17 JST (21:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - targets.json
      - want.json
      - scripts/fetch.py
      - .github/workflows/fetch.yml

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install image library
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Fetch
        working-directory: repo
        run: python3 scripts/fetch.py

      - name: Save results
        working-directory: repo
        run: |
          git config user.name "fuku-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data thumbs
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -q -m "data $(TZ=Asia/Tokyo date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
